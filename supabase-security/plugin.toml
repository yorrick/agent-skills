# The ONLY hand-edited metadata for this plugin.
# Both harnesses' manifests are generated from it:
#   uv run scripts/sync_manifests.py

[plugin]
name = "supabase-security"
version = "0.1.0"
license = "MIT"
description = """Access-control rules for Supabase projects exposed directly to a browser via PostgREST. Covers the three enforcement layers (GRANT, RLS, triggers), the traps that cause privilege escalation, and how anon keys, JWTs and service_role actually differ."""
