[project]
name = "claude-code-plugins"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
