# The ONLY hand-edited metadata for this plugin.
# Both harnesses' manifests are generated from it:
#   uv run scripts/sync_manifests.py

[plugin]
name = "jev-router"
version = "0.1.0"
license = "MIT"
description = "Asks Jev (via OpenRouter) how big each message is and sends small jobs to a smaller, cheaper model. Off until you turn it on with /jev on."
keywords = ["routing", "models", "cost", "openrouter", "jev"]
