# The ONLY hand-edited metadata for this plugin.
# Both harnesses' manifests are generated from it:
#   uv run scripts/sync_manifests.py

[plugin]
name = "jev-router"
version = "0.3.0"
license = "MIT"
description = "Asks Jev (via OpenRouter) how long each job will run and, in Claude Code, whether a fresh subagent would do it cheaper. Starts in shadow mode. Off until you turn it on with /jev on."
keywords = ["routing", "models", "cost", "openrouter", "jev"]
