name: Star Monitor

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9am UTC
  workflow_dispatch: {}

jobs:
  check-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Check star count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARS=$(gh api repos/${{ github.repository }} --jq '.stargazers_count')
          echo "Current stars: $STARS"
          if [ "$STARS" -ge 10 ]; then
            EXISTING=$(gh issue list --repo ${{ github.repository }} --search "10 stars reached" --state open --json number --jq 'length')
            if [ "$EXISTING" -eq 0 ]; then
              gh issue create --repo ${{ github.repository }} \
                --title "10 stars reached — time to submit to travisvn/awesome-claude-skills" \
                --body "The repo has reached **$STARS** stars. You can now open a PR on [travisvn/awesome-claude-skills](https://github.com/travisvn/awesome-claude-skills) which requires a minimum of 10 stars for submissions."
            fi
          fi
