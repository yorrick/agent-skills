name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Reason: without this, the marketplace drifts from the plugin manifests
      # silently. It already had: the hand-maintained marketplace advertised
      # dev-loop@0.14.0 while the plugin was 0.29.0, and self-improve-skill@1.0.0
      # while it was 2.0.0. Users were told the wrong version for months.
      - name: Manifests are current
        run: uv run scripts/sync_manifests.py --check

      - name: Skill frontmatter is valid
        run: uv run scripts/validate_skills.py

      - name: Format
        run: uv run ruff format --check .

      # Reason: plugin scripts contain two pre-existing lint errors: E741 in
      # pr-review/scripts/post_review.py and E402 in
      # self-improve-skill/scripts/session_start_hook.py. Gate the repository
      # automation and contract tests until those are repaired.
      - name: Lint
        run: uv run ruff check scripts/ tests/

      - name: Contract tests
        run: uv run pytest tests/

      - name: Type check
        run: uv run pyright
